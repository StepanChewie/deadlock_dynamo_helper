<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>Dynamo Lab Overlay</title>
    <style>
      :root {
        --overlay-width: 340px;
        --canvas: #041b25;
        --surface: #08222b;
        --line: #28505a;
        --line-soft: rgba(40, 80, 90, 0.6);
        --text: #e7eff0;
        --muted: #91aeb4;
        --amber: #e4a24d;
        --weapon: #d99a3a;
        --vitality: #63b77a;
        --spirit: #a778d4;
        --sans: "Arial Narrow", "Roboto Condensed", "Segoe UI", system-ui, sans-serif;
        --mono: ui-monospace, "Cascadia Mono", "Consolas", monospace;
      }

      * { box-sizing: border-box; }
      html, body { width: var(--overlay-width); min-height: 100%; margin: 0; overflow-x: hidden; }
      body {
        padding: 8px;
        color: var(--text);
        background: transparent;
        font-family: var(--sans);
      }

      .hud-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
        min-width: 0;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--surface);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45), inset 0 1px rgba(231, 239, 240, 0.05);
        user-select: none;
      }

      .overlay-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 26px;
        cursor: move;
      }

      .overlay-brand { display: flex; align-items: center; gap: 8px; min-width: 0; }

      .brand-mark {
        width: 22px;
        height: 22px;
        flex: none;
        display: grid;
        place-items: center;
        border: 1px solid var(--amber);
        border-radius: 3px;
        color: var(--amber);
        font: 700 11px/1 var(--mono);
      }

      .overlay-title {
        margin: 0;
        overflow: hidden;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .overlay-state {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font: 600 9px/1 var(--sans);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      #indicator-dot {
        width: 6px;
        height: 6px;
        flex: none;
        border-radius: 50%;
        background: var(--muted);
      }

      #indicator-dot.active {
        background: var(--vitality);
        box-shadow: 0 0 7px var(--vitality);
      }

      #guide-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 18px 12px;
        border: 1px dashed var(--line);
        color: var(--muted);
        text-align: center;
      }

      .waiting-pulse {
        width: 28px;
        height: 28px;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(228, 162, 77, 0.22), transparent 66%);
      }

      .waiting-title {
        margin: 0;
        color: var(--text);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .waiting-copy { max-width: 250px; margin: 0; font-size: 10px; line-height: 1.45; }

      #guide-active {
        display: none;
        flex-direction: column;
        min-width: 0;
      }

      #situational-recommendation-panel {
        display: none;
        flex-direction: column;
        min-width: 0;
      }

      #rec-update-note {
        display: none;
        align-items: center;
        margin-bottom: 8px;
        padding: 6px 8px;
        border: 1px solid rgba(228, 162, 77, 0.35);
        border-radius: 3px;
        color: var(--amber);
        background: rgba(228, 162, 77, 0.08);
        font-size: 9.5px;
        letter-spacing: 0.03em;
      }

      #rec-plan {
        display: grid;
        row-gap: 8px;
        min-width: 0;
      }

      .purchase-row {
        --kind: var(--muted);
        display: grid;
        grid-template-columns: 20px 52px minmax(0, 1fr) auto;
        grid-template-areas:
          "pos art copy copy"
          "pos art price category";
        align-items: center;
        gap: 2px 8px;
        min-width: 0;
        padding: 10px 8px;
        border: 1px solid var(--line-soft);
        background: rgba(4, 27, 37, 0.55);
      }

      .purchase-row.slot-weapon { --kind: var(--weapon); }
      .purchase-row.slot-vitality { --kind: var(--vitality); }
      .purchase-row.slot-spirit { --kind: var(--spirit); }

      .purchase-row.is-current {
        background: rgba(228, 162, 77, 0.07);
        box-shadow: inset 0 0 0 1px rgba(228, 162, 77, 0.72);
      }

      .purchase-position {
        grid-area: pos;
        width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 50%;
        color: var(--muted);
        font: 700 10px/1 var(--mono);
        font-variant-numeric: tabular-nums;
      }

      .purchase-row.is-current .purchase-position {
        border-color: var(--amber);
        color: #041b25;
        background: var(--amber);
      }

      .item-art {
        grid-area: art;
        position: relative;
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        background: #102b39;
      }

      .item-art-fallback {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--kind);
        font: 700 15px/1 var(--mono);
      }

      .item-art dl-item-card {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
      }

      .purchase-copy {
        grid-area: copy;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .purchase-copy strong {
        overflow: hidden;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.15;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .purchase-copy small {
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      .purchase-price {
        grid-area: price;
        justify-self: start;
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
        white-space: nowrap;
      }

      .purchase-category {
        grid-area: category;
        justify-self: end;
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--kind);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .purchase-category::before {
        content: "";
        width: 6px;
        height: 6px;
        flex: none;
        background: var(--kind);
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <main class="hud-container">
      <header class="overlay-header">
        <div class="overlay-brand"><span class="brand-mark">D</span><h1 class="overlay-title">Dynamo Lab</h1></div>
        <span class="overlay-state" aria-live="polite"><span id="indicator-dot" aria-hidden="true"></span><span id="indicator-text">Connecting</span></span>
      </header>

      <section id="guide-empty">
        <div class="waiting-pulse"></div>
        <h2 id="guide-empty-title" class="waiting-title">Waiting for match data</h2>
        <p id="guide-empty-copy" class="waiting-copy">Your Dynamo Lab build route will appear automatically when the match is detected.</p>
      </section>

      <section id="guide-active">
        <div id="situational-recommendation-panel">
          <div id="rec-update-note"></div>
          <div id="rec-plan" aria-label="Five-item purchase route" data-route-limit="5"></div>
        </div>
      </section>
    </main>
    <script type="module" src="https://unpkg.com/@deadlock-api/ui-core/dist/main/main.esm.js"></script>
    <script src="dist/index.js"></script>
  </body>
</html>
