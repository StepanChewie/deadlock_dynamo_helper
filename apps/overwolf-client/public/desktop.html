<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>Dynamo Lab</title>
    <style>
      :root {
        --canvas: #041b25;
        --nav: #062631;
        --surface: #08222b;
        --line: #28505a;
        --line-soft: rgba(40, 80, 90, 0.6);
        --text: #e7eff0;
        --muted: #91aeb4;
        --amber: #e4a24d;
        --weapon: #d99a3a;
        --vitality: #63b77a;
        --spirit: #a778d4;
        --grid-columns: 28px 56px minmax(0, 1fr) auto auto;
        --sans: "Arial Narrow", "Roboto Condensed", "Segoe UI", system-ui, sans-serif;
        --mono: ui-monospace, "Cascadia Mono", "Consolas", monospace;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        color: var(--text);
        background: var(--canvas);
        font-family: var(--sans);
      }

      /* Flex child: any injected element shrinks the shell instead of clipping it. */
      .app-shell {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        flex: 1;
        min-height: 0;
      }

      /* Navigation ------------------------------------------------------- */
      .app-nav {
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-width: 0;
        padding: 16px 14px;
        border-right: 1px solid var(--line);
        background: var(--nav);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        color: var(--text);
        text-decoration: none;
      }

      .brand img {
        width: 34px;
        height: 34px;
        flex: none;
        object-fit: cover;
        border: 1px solid var(--line);
        border-radius: 4px;
        filter: saturate(0.85) contrast(1.05);
      }

      .brand span {
        overflow: hidden;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .app-nav nav { display: flex; flex-direction: column; gap: 3px; }

      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        width: 100%;
        min-height: 38px;
        padding: 8px 10px;
        border: 1px solid transparent;
        border-radius: 3px;
        color: var(--muted);
        background: transparent;
        font: 600 12.5px/1.2 var(--sans);
        letter-spacing: 0.07em;
        text-align: left;
        text-transform: uppercase;
        cursor: pointer;
      }

      .nav-item small {
        color: var(--muted);
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 0.09em;
        opacity: 0.7;
      }

      .nav-item.is-active {
        border-color: var(--line);
        color: var(--text);
        background: rgba(228, 162, 77, 0.08);
        box-shadow: inset 2px 0 0 var(--amber);
      }

      .nav-item[disabled] {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .nav-item:focus-visible,
      .refresh-button:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
      }

      /* Workspace -------------------------------------------------------- */
      .workspace {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--canvas);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        min-height: 52px;
        padding: 8px 18px;
        border-bottom: 1px solid var(--line);
        background: #071c29;
      }

      .topbar-actions { display: flex; align-items: center; gap: 16px; min-width: 0; }

      .connection-state {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font: 600 10px/1 var(--sans);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      #indicator-dot {
        width: 7px;
        height: 7px;
        flex: none;
        border-radius: 50%;
        background: var(--muted);
      }

      #indicator-dot.active {
        background: var(--vitality);
        box-shadow: 0 0 8px var(--vitality);
      }

      /* The indicator is the visible connection state; #status stays an announced live region. */
      #status {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      #status.connected { color: var(--vitality); }
      #status.error { color: var(--amber); }

      .refresh-button {
        min-height: 34px;
        padding: 0 16px;
        border: 1px solid var(--amber);
        border-radius: 3px;
        color: var(--text);
        background: #0a2634;
        font: 700 12px/1 var(--sans);
        letter-spacing: 0.09em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .refresh-button:hover:not([disabled]) { background: #0d3140; }
      .refresh-button[disabled] { cursor: progress; opacity: 0.6; }

      .build-workspace {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 16px 24px;
        overflow: auto;
      }

      .build-plane {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        border: 1px solid var(--line);
        background: var(--surface);
      }

      .build-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 48px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
      }

      .build-head h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .build-head span {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      #guide-empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 28px;
        color: var(--muted);
        text-align: center;
      }

      .waiting-pulse {
        width: 38px;
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(228, 162, 77, 0.24), transparent 66%);
      }

      .waiting-title {
        margin: 0;
        color: var(--text);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .waiting-copy {
        max-width: 380px;
        margin: 0;
        font-size: 12px;
        line-height: 1.5;
      }

      #guide-active {
        flex: 1;
        min-height: 0;
        display: none;
        flex-direction: column;
        overflow: auto;
      }

      #situational-recommendation-panel {
        flex: 1;
        min-height: 0;
        display: none;
        flex-direction: column;
      }

      #rec-update-note {
        display: none;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid rgba(228, 162, 77, 0.35);
        color: var(--amber);
        background: rgba(228, 162, 77, 0.08);
        font-size: 11px;
        letter-spacing: 0.04em;
      }

      #rec-plan {
        flex: 1;
        min-height: 0;
        display: grid;
        align-content: start;
      }

      /* Purchase rows ---------------------------------------------------- */
      .purchase-row {
        --kind: var(--muted);
        display: grid;
        grid-template-columns: var(--grid-columns);
        align-items: center;
        gap: 16px;
        min-height: 64px;
        padding: 8px 18px;
        border-bottom: 1px solid var(--line-soft);
      }

      .purchase-row.slot-weapon { --kind: var(--weapon); }
      .purchase-row.slot-vitality { --kind: var(--vitality); }
      .purchase-row.slot-spirit { --kind: var(--spirit); }

      .purchase-row.is-current {
        background: rgba(228, 162, 77, 0.07);
        box-shadow: inset 0 0 0 1px rgba(228, 162, 77, 0.72);
      }

      .purchase-position {
        justify-self: center;
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 50%;
        color: var(--muted);
        font: 700 12px/1 var(--mono);
        font-variant-numeric: tabular-nums;
      }

      .purchase-row.is-current .purchase-position {
        border-color: var(--amber);
        color: #041b25;
        background: var(--amber);
      }

      .item-art {
        position: relative;
        justify-self: center;
        align-self: center;
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 4px;
        overflow: hidden;
        background: #102b39;
      }

      .item-art-fallback {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--kind);
        font: 700 16px/1 var(--mono);
      }

      .item-art dl-item-card {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
      }

      .purchase-copy {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .purchase-copy strong {
        overflow: hidden;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .purchase-copy small {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .purchase-price {
        justify-self: end;
        font: 700 19px/1 var(--mono);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .purchase-category {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--kind);
        font: 700 11px/1 var(--sans);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .purchase-category::before {
        content: "";
        width: 7px;
        height: 7px;
        flex: none;
        background: var(--kind);
      }

      /* Invisible Overwolf ad container in bottom-left corner */
      #ow-ad-container {
        margin-top: auto;
        width: 100%;
        min-height: 250px;
      }

      #console { display: none; }

      /* Responsive ------------------------------------------------------- */
      @media (max-width: 820px) {
        .app-shell { grid-template-columns: 66px minmax(0, 1fr); }
        .app-nav { padding: 12px 8px; }
        .brand span,
        .nav-item span,
        .nav-item small,
        #ow-ad-container { display: none; }
        .nav-item { align-items: center; padding: 8px 4px; }
        .nav-item.is-active { background: rgba(228, 162, 77, 0.14); }
        .build-workspace { padding: 10px; }
        .purchase-row { grid-template-columns: 24px 44px minmax(0, 1fr) minmax(64px, auto); }
        .purchase-category { grid-column: 4; justify-self: end; }
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body class="desktop-surface">
    <div class="app-shell">
      <aside class="app-nav">
        <a class="brand" aria-label="Dynamo Lab home"><img src="dynamo.png" alt="" /><span>Dynamo Lab</span></a>
        <nav aria-label="Dynamo Lab navigation">
          <button type="button" class="nav-item" aria-disabled="true" disabled aria-label="Overview, coming soon"><span>Overview</span><small>Coming soon</small></button>
          <button type="button" class="nav-item is-active" aria-current="page"><span>Live Build</span><small>Active</small></button>
          <button type="button" class="nav-item" aria-disabled="true" disabled aria-label="Matches, coming soon"><span>Matches</span><small>Coming soon</small></button>
          <button type="button" class="nav-item" aria-disabled="true" disabled aria-label="Match Analysis, coming soon"><span>Match Analysis</span><small>Coming soon</small></button>
          <button type="button" class="nav-item" aria-disabled="true" disabled aria-label="Settings, coming soon"><span>Settings</span><small>Coming soon</small></button>
        </nav>
        <div id="ow-ad-container" aria-hidden="true"></div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <span class="connection-state" aria-live="polite"><span id="indicator-dot" aria-hidden="true"></span><span id="indicator-text">Connecting</span></span>
          <div class="topbar-actions">
            <span id="status" class="connection-state" aria-live="polite"></span>
            <button id="refresh-build" type="button" class="refresh-button" onclick="overwolf.windows.getMainWindow().refreshBuild?.()">Refresh</button>
          </div>
        </header>

        <section class="build-workspace">
          <div class="build-plane">
            <header class="build-head"><h1 id="build-title">Full build</h1><span>Route</span></header>

            <section id="guide-empty">
              <div class="waiting-pulse"></div>
              <h2 id="guide-empty-title" class="waiting-title">Waiting for match data</h2>
              <p id="guide-empty-copy" class="waiting-copy">Your Dynamo Lab build route will appear automatically when the match is detected.</p>
            </section>

            <section id="guide-active">
              <div id="situational-recommendation-panel">
                <div id="rec-update-note"></div>
                <div id="rec-plan" aria-label="Full build route" data-route-limit="all"></div>
              </div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <pre id="console" hidden></pre>
    <script type="module" src="https://unpkg.com/@deadlock-api/ui-core@1.5.0/dist/main/main.esm.js"></script>
    <script src="dist/index.js"></script>
  </body>
</html>
