services:
  api:
    image: ${DEADLOCK_API_IMAGE:-deadlock-adaptive-production:current}

    # tini as PID 1. Do not remove.
    # Chromium's children (zygotes, chrome_crashpad) are orphaned whenever browser.close()
    # fails to tear down the whole tree. Without an init they re-parent to PID 1, which is
    # `node` -- and Node only reaps children it spawned itself via libuv, so re-parented
    # orphans are never reaped and become permanent zombies, each holding a task slot.
    # On 2026-09-16 that reached 14 179 zombies: pids 14192/14192, fork() -> EAGAIN, and the
    # healthcheck (which forks `node -e`) could never run again. init reaps them instead.
    init: true

    # Blast-radius guard. The ceiling inherited from systemd's DefaultTasksMax is 14192
    # (15% of the host's threads-max), so a runaway in this container can starve every other
    # container on the box -- it did. Steady state is ~110 tasks and one browser costs a few
    # dozen, so this is ~30x headroom. Keep a cap here; do not fall back to the systemd default.
    pids_limit: 4096

    ports:
      - '3000:3000'
    volumes:
      - deadlock-storage:/app/apps/api/storage
    environment:
      - DB_HOST=${DB_HOST:-aboba-telegramovich-postgres-1}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-deadlock_builds}
      - DB_CONNECT_TIMEOUT_MS=${DB_CONNECT_TIMEOUT_MS:-10000}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_KEEP_ALIVE_INITIAL_DELAY_MS=${DB_KEEP_ALIVE_INITIAL_DELAY_MS:-10000}
      - DB_IDLE_TIMEOUT_MS=${DB_IDLE_TIMEOUT_MS:-30000}
      - DB_RUN_MIGRATIONS=${DB_RUN_MIGRATIONS:-false}
      - BUILD_DEBUG_PASSWORD=${BUILD_DEBUG_PASSWORD}
      - BUILD_DEBUG_SESSION_SECRET=${BUILD_DEBUG_SESSION_SECRET}
      - BUILD_DEBUG_SESSION_TTL_SEC=${BUILD_DEBUG_SESSION_TTL_SEC:-3600}
      - BUILD_DEBUG_TRACE_TAIL=${BUILD_DEBUG_TRACE_TAIL:-5}
      - BUILD_DEBUG_TRACE_IDLE_TTL_SEC=${BUILD_DEBUG_TRACE_IDLE_TTL_SEC:-1800}
      - DEADLOCK_API_KEY=${DEADLOCK_API_KEY}
      - DEADLOCK_API_BASE_URL=${DEADLOCK_API_BASE_URL:-https://api.deadlock-api.com}
      - ADAPTIVE_ECONOMY_RULES_JSON=${ADAPTIVE_ECONOMY_RULES_JSON:-}
      - CHROMIUM_PATH=${CHROMIUM_PATH:-/usr/bin/chromium-browser}
      - NODE_OPTIONS=--max-old-space-size=4096
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/deadlock/adaptive/v1/status').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    restart: always
    networks:
      - default
      - aboba-telegramovich_default

volumes:
  deadlock-storage:

networks:
  aboba-telegramovich_default:
    external: true
