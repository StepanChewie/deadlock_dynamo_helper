services:
  api:
    image: ${DEADLOCK_API_IMAGE:-deadlock-adaptive-production:current}
    ports:
      - '3000:3000'
    volumes:
      - deadlock-storage:/app/apps/api/storage
    environment:
      - DB_HOST=${DB_HOST:-aboba-telegramovich-postgres-1}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-deadlock_builds}
      - DB_CONNECT_TIMEOUT_MS=${DB_CONNECT_TIMEOUT_MS:-10000}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_KEEP_ALIVE_INITIAL_DELAY_MS=${DB_KEEP_ALIVE_INITIAL_DELAY_MS:-10000}
      - DB_IDLE_TIMEOUT_MS=${DB_IDLE_TIMEOUT_MS:-30000}
      - DB_RUN_MIGRATIONS=${DB_RUN_MIGRATIONS:-false}
      - BUILD_DEBUG_PASSWORD=${BUILD_DEBUG_PASSWORD}
      - BUILD_DEBUG_SESSION_SECRET=${BUILD_DEBUG_SESSION_SECRET}
      - BUILD_DEBUG_SESSION_TTL_SEC=${BUILD_DEBUG_SESSION_TTL_SEC:-3600}
      - BUILD_DEBUG_TRACE_TAIL=${BUILD_DEBUG_TRACE_TAIL:-5}
      - BUILD_DEBUG_TRACE_IDLE_TTL_SEC=${BUILD_DEBUG_TRACE_IDLE_TTL_SEC:-1800}
      - DEADLOCK_API_KEY=${DEADLOCK_API_KEY}
      - DEADLOCK_API_BASE_URL=${DEADLOCK_API_BASE_URL:-https://api.deadlock-api.com}
      - ADAPTIVE_ECONOMY_RULES_JSON=${ADAPTIVE_ECONOMY_RULES_JSON:-}
      - CHROMIUM_PATH=${CHROMIUM_PATH:-/usr/bin/chromium-browser}
      - NODE_OPTIONS=--max-old-space-size=4096
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/deadlock/adaptive/v1/status').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    restart: always
    networks:
      - default
      - aboba-telegramovich_default

volumes:
  deadlock-storage:

networks:
  aboba-telegramovich_default:
    external: true
