services:
  api:
    image: ${DEADLOCK_API_IMAGE:-deadlock-adaptive-production:current}

    # tini as PID 1. Do not remove.
    # Chromium's children (zygotes, chrome_crashpad) are orphaned whenever browser.close()
    # fails to tear down the whole tree. Without an init they re-parent to PID 1, which is
    # `node` -- and Node only reaps children it spawned itself via libuv, so re-parented
    # orphans are never reaped and become permanent zombies, each holding a task slot.
    # On 2026-09-16 that reached 14 179 zombies: pids 14192/14192, fork() -> EAGAIN, and the
    # healthcheck (which forks `node -e`) could never run again. init reaps them instead.
    init: true

    # Blast-radius guard. The ceiling inherited from systemd's DefaultTasksMax is 14192
    # (15% of the host's threads-max), so a runaway in this container can starve every other
    # container on the box -- it did. Steady state is ~110 tasks and one browser costs a few
    # dozen, so this is ~30x headroom. Keep a cap here; do not fall back to the systemd default.
    pids_limit: 4096

    # Second blast-radius guard, for disk. The json-file driver keeps every line forever by
    # default, and during the 2026-09-16 storm (1843 failed healthchecks over 30 hours) this
    # container's log grew with no ceiling at all on a box that was already full. 3 x 10 MB is
    # weeks of normal operation and still hours of a storm -- enough to diagnose from, and
    # unable to fill the disk.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    # Loopback only. Verified against the actual perimeter on 2026-09-16: nginx runs on the
    # host (systemd, not a container) and every relevant location proxies to
    # http://127.0.0.1:3000, so it still reaches the API after this change.
    #
    # Why bother when 0.0.0.0 was already unreachable: the host firewall blocks :3000 today,
    # so this is defence in depth, not a fix for an open hole. But with 0.0.0.0 the whole API
    # -- including routes nginx does not even have a location for, such as /deadlock-live/ --
    # is one cloud-firewall misconfiguration away from being public. Loopback removes that
    # dependency entirely.
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - deadlock-storage:/app/apps/api/storage
    environment:
      - DB_HOST=${DB_HOST:-aboba-telegramovich-postgres-1}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-deadlock_builds}
      - DB_CONNECT_TIMEOUT_MS=${DB_CONNECT_TIMEOUT_MS:-10000}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_KEEP_ALIVE_INITIAL_DELAY_MS=${DB_KEEP_ALIVE_INITIAL_DELAY_MS:-10000}
      - DB_IDLE_TIMEOUT_MS=${DB_IDLE_TIMEOUT_MS:-30000}
      - DB_RUN_MIGRATIONS=${DB_RUN_MIGRATIONS:-false}
      - BUILD_DEBUG_PASSWORD=${BUILD_DEBUG_PASSWORD}
      - BUILD_DEBUG_SESSION_SECRET=${BUILD_DEBUG_SESSION_SECRET}
      - BUILD_DEBUG_SESSION_TTL_SEC=${BUILD_DEBUG_SESSION_TTL_SEC:-3600}
      - BUILD_DEBUG_TRACE_TAIL=${BUILD_DEBUG_TRACE_TAIL:-5}
      - BUILD_DEBUG_TRACE_IDLE_TTL_SEC=${BUILD_DEBUG_TRACE_IDLE_TTL_SEC:-1800}
      # Guards operator-only routes (reference-data, live reads, debug page, statelocker probe).
      # Unset means those routes fail closed with 401 rather than becoming public. The shipped
      # Overwolf client never sends it -- it only calls recommend, feedback and live/events.
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      # Comma-separated CORS allowlist. Empty keeps the API permissive.
      #
      # Measured, not guessed: the Overwolf client sends a non-standard Origin that carries the
      # app UID -- `https://www.overwolf.com/<uid>` -- captured from live traffic through nginx.
      # A plain `https://www.overwolf.com` entry would NOT match, because the comparison is on the
      # whole string. The UID is derived from meta.name and meta.author, so renaming the app
      # changes this value and the client would stop being allowed until it is updated here.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - DEADLOCK_API_BASE_URL=${DEADLOCK_API_BASE_URL:-https://api.deadlock-api.com}
      - ADAPTIVE_ECONOMY_RULES_JSON=${ADAPTIVE_ECONOMY_RULES_JSON:-}
      - CHROMIUM_PATH=${CHROMIUM_PATH:-/usr/bin/chromium-browser}
      - NODE_OPTIONS=--max-old-space-size=4096
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/deadlock/adaptive/v1/status').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    restart: always
    networks:
      - default
      - aboba-telegramovich_default

volumes:
  deadlock-storage:

networks:
  aboba-telegramovich_default:
    external: true
