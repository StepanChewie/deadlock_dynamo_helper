# Deadlock Statlocker probe location block.
#
# This is a verbatim copy of the block that is live inside the HTTPS
# `server { ... }` of aboba-telegramovich.duckdns.org, markers included.
# Applying it verbatim is a no-op; see README.md for how it is applied.
#
# It is NOT managed by deploy.yml — unlike DEADLOCK_DYNAMO_HELPER, this block
# was placed by hand and stays that way. That is precisely why it is committed:
# it is the only record of the route's real timeouts.
#
# Timeouts are 90s on purpose, not 30s. This route boots a headless Chromium
# instance, making it the slowest in the API; 30s cut real requests short.
# Do not lower them without measuring the probe first.
    # BEGIN STATLOCKER_PROBE_POC
    location ^~ /deadlock/tools/statlocker {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
    # END STATLOCKER_PROBE_POC
