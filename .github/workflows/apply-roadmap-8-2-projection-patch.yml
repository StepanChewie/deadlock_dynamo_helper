name: Apply Roadmap 8.2 Projection Patch

on:
  push:
    branches:
      - feat/threat-weighted-wpa-build
    paths:
      - '.github/workflows/apply-roadmap-8-2-projection-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/threat-weighted-wpa-build
          clean: true

      - name: Apply projection patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/statlocker-adaptive/strategy-first-build-planner-v1.service.ts')
          source = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count} for:\n{old}')
              source = source.replace(old, new, 1)

          replace_once(
              "    const slotPlan = this.slots.plan({\n      strategy,\n      contract: investmentAwareContract,\n      itemGraph: input.decision.itemGraph,\n      ownedItemIds,\n      slots: input.decision.slots,\n    });",
              "    const slotPlan = alignSlotPlanWithSelectedCandidateV1(\n      this.slots.plan({\n        strategy,\n        contract: investmentAwareContract,\n        itemGraph: input.decision.itemGraph,\n        ownedItemIds,\n        slots: input.decision.slots,\n      }),\n      first?.candidate,\n      investmentAwareContract.currentGoalId,\n    );",
          )
          replace_once(
              "    const owned = heldIds(input.decision.state);\n    const rows: AdaptivePlannedItemV1[] = owned.map((itemId, index) => ({",
              "    const currentOwned = heldIds(input.decision.state);\n    const owned = retainedOwnedItemIdsForCandidateV1(currentOwned, nextCandidate);\n    const rows: AdaptivePlannedItemV1[] = owned.map((itemId, index) => ({",
          )
          replace_once(
              "function applyHardInvestmentObligations(\n",
              "function alignSlotPlanWithSelectedCandidateV1(\n  slotPlan: BuildSlotPlanV1,\n  candidate: RecommendationCandidate | undefined,\n  currentGoalId: string | undefined,\n): BuildSlotPlanV1 {\n  const action = candidate?.action;\n  if (action?.type !== 'REPLACE_ITEM') return slotPlan;\n\n  let aligned = false;\n  const futureTransitions = slotPlan.futureTransitions.map((transition) => {\n    if (transition.requirement !== 'REPLACE' ||\n      transition.targetItemId !== action.buyItemId ||\n      (currentGoalId !== undefined && transition.targetGoalId !== currentGoalId)) {\n      return transition;\n    }\n    aligned = true;\n    return {\n      ...transition,\n      sourceItemId: action.sellItemId,\n      reasonCodes: unique([...transition.reasonCodes, 'WHOLE_BUILD_REPLACEMENT_SELECTED']).sort(),\n    };\n  });\n  if (!aligned) return slotPlan;\n  return {\n    ...slotPlan,\n    futureTransitions,\n    reasonCodes: unique([...slotPlan.reasonCodes, 'WHOLE_BUILD_REPLACEMENT_SELECTED']).sort(),\n  };\n}\n\nfunction retainedOwnedItemIdsForCandidateV1(\n  ownedItemIds: readonly number[],\n  candidate: RecommendationCandidate | undefined,\n): number[] {\n  const action = candidate?.action;\n  if (!action) return [...ownedItemIds];\n  if (action.type === 'REPLACE_ITEM') return ownedItemIds.filter((itemId) => itemId !== action.sellItemId);\n  if (action.type === 'SELL_ITEM') return ownedItemIds.filter((itemId) => itemId !== action.itemId);\n  if (action.type === 'UPGRADE_ITEM') {\n    const consumed = new Set(action.consumedItemIds);\n    return ownedItemIds.filter((itemId) => !consumed.has(itemId));\n  }\n  return [...ownedItemIds];\n}\n\nfunction applyHardInvestmentObligations(\n",
          )

          path.write_text(source)
          PY

          git diff --check
          git diff -- apps/api/src/statlocker-adaptive/strategy-first-build-planner-v1.service.ts

      - name: Commit projection patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/statlocker-adaptive/strategy-first-build-planner-v1.service.ts
          git commit -m 'fix: align replacement plan and projected build'
          git push origin HEAD:feat/threat-weighted-wpa-build
