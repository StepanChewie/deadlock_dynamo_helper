name: Statlocker Lifecycle Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Capture public Statlocker lifecycle source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build adaptive production image
        run: docker build -t deadlock-statlocker-probe:ci .

      - name: Capture Billy item meta source
        shell: bash
        run: |
          docker run --rm -i --entrypoint node deadlock-statlocker-probe:ci - <<'NODE' > "$RUNNER_TEMP/statlocker-lifecycle-probe.json"
          const puppeteer = require('puppeteer-core');

          const TARGET_NAMES = [
            'Crippling Headshot',
            'Weapon Shielding',
            'Bullet Resist Shredder',
            'Long Range',
            'Lucky Shot',
            'Witchmail',
          ];

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROMIUM_PATH,
              headless: true,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--disable-gpu',
              ],
            });

            try {
              const page = await browser.newPage();
              const requestedUrl = 'https://statlocker.gg/items/meta-model?hero=Billy&heroId=6&min=500&mode=items-heroes&patch=patch_676255623445218601';
              await page.goto(requestedUrl, { waitUntil: 'networkidle2', timeout: 90000 });
              await new Promise((resolve) => setTimeout(resolve, 3000));

              const proof = await page.evaluate(async (targetNames) => {
                async function fetchJson(path) {
                  const response = await fetch(path, { credentials: 'same-origin' });
                  const text = await response.text();
                  if (!response.ok) throw new Error(`${path} -> ${response.status}: ${text.slice(0, 500)}`);
                  return JSON.parse(text);
                }

                function flatten(value, output = []) {
                  if (Array.isArray(value)) {
                    for (const item of value) flatten(item, output);
                    return output;
                  }
                  if (value && typeof value === 'object') {
                    output.push(value);
                    for (const nested of Object.values(value)) flatten(nested, output);
                  }
                  return output;
                }

                function pickName(row) {
                  return row?.name ?? row?.item_name ?? row?.itemName ?? row?.display_name ?? row?.displayName;
                }

                function pickId(row) {
                  const value = row?.id ?? row?.item_id ?? row?.itemId ?? row?.game_id ?? row?.gameId;
                  const numeric = Number(value);
                  return Number.isInteger(numeric) && numeric > 0 ? numeric : undefined;
                }

                const lifecyclePath = '/api/info/wpa-filtered-items?hero=Billy&tier=all&rank=ranked&category=all&gameState=all&purchaseTime=all&teamComp=Average+Comp&buildType=all&patch=patch_676255623445218601&minSampleSize=500&searchTerm=&sortBy=wpa';
                const [lifecycleRaw, itemsFullRaw, itemsRaw] = await Promise.all([
                  fetchJson(lifecyclePath),
                  fetchJson('/api/info/items-full?v=08-22-2026'),
                  fetchJson('/api/info/items'),
                ]);

                const metadataRows = [...flatten(itemsFullRaw), ...flatten(itemsRaw)];
                const metadataByName = new Map();
                for (const row of metadataRows) {
                  const name = pickName(row);
                  const id = pickId(row);
                  if (typeof name === 'string' && id !== undefined && !metadataByName.has(name)) {
                    metadataByName.set(name, { itemId: id, sourceRow: row });
                  }
                }

                const lifecycleRows = flatten(lifecycleRaw).filter((row) =>
                  typeof row?.wpaValue === 'number' &&
                  typeof row?.mean_purchase_time_min === 'number' &&
                  typeof pickName(row) === 'string'
                );

                const matches = targetNames.map((name) => {
                  const lifecycle = lifecycleRows.find((row) => pickName(row) === name);
                  const metadata = metadataByName.get(name);
                  return {
                    name,
                    itemId: metadata?.itemId,
                    wpaValue: lifecycle?.wpaValue,
                    sampleSize: lifecycle?.sampleSize,
                    mean_purchase_time_min: lifecycle?.mean_purchase_time_min,
                    lifecycleRow: lifecycle,
                    metadataRow: metadata?.sourceRow,
                  };
                });

                return {
                  lifecyclePath,
                  lifecycleRaw,
                  matches,
                };
              }, TARGET_NAMES);

              process.stdout.write(JSON.stringify({
                requestedUrl,
                finalUrl: page.url(),
                ...proof,
              }, null, 2));
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload lifecycle probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: statlocker-lifecycle-probe-${{ github.sha }}
          path: ${{ runner.temp }}/statlocker-lifecycle-probe.json
          if-no-files-found: error
          retention-days: 3
