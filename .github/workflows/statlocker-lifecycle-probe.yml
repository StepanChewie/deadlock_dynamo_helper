name: Statlocker Lifecycle Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    name: Capture public Statlocker lifecycle source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/statlocker-adaptive-progression-replacement
          persist-credentials: true

      - name: Build adaptive production image
        run: docker build -t deadlock-statlocker-probe:ci .

      - name: Capture Billy item meta source
        shell: bash
        run: |
          docker run --rm -i --entrypoint node deadlock-statlocker-probe:ci - <<'NODE' > "$RUNNER_TEMP/statlocker-lifecycle-probe.json"
          const puppeteer = require('puppeteer-core');

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROMIUM_PATH,
              headless: true,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--disable-gpu',
              ],
            });

            try {
              const page = await browser.newPage();
              const requestedUrl = 'https://statlocker.gg/items/meta-model?hero=Billy&heroId=6&min=500&mode=items-heroes&patch=patch_676255623445218601';
              await page.goto(requestedUrl, { waitUntil: 'networkidle2', timeout: 90000 });
              await new Promise((resolve) => setTimeout(resolve, 3000));

              const proof = await page.evaluate(async () => {
                async function fetchJson(path) {
                  const response = await fetch(path, { credentials: 'same-origin' });
                  const text = await response.text();
                  if (!response.ok) throw new Error(`${path} -> ${response.status}: ${text.slice(0, 500)}`);
                  return JSON.parse(text);
                }

                function flatten(value, output = []) {
                  if (Array.isArray(value)) {
                    for (const item of value) flatten(item, output);
                    return output;
                  }
                  if (value && typeof value === 'object') {
                    output.push(value);
                    for (const nested of Object.values(value)) flatten(nested, output);
                  }
                  return output;
                }

                function metadataName(row) {
                  return row?.name ?? row?.item_name ?? row?.itemName ?? row?.display_name ?? row?.displayName;
                }

                function lifecycleName(row) {
                  return row?.item ?? row?.name ?? row?.item_name ?? row?.itemName;
                }

                function pickId(row) {
                  const value = row?.id ?? row?.item_id ?? row?.itemId ?? row?.game_id ?? row?.gameId;
                  const numeric = Number(value);
                  return Number.isInteger(numeric) && numeric > 0 ? numeric : undefined;
                }

                const lifecyclePath = '/api/info/wpa-filtered-items?hero=Billy&tier=all&rank=ranked&category=all&gameState=all&purchaseTime=all&teamComp=Average+Comp&buildType=all&patch=patch_676255623445218601&minSampleSize=500&searchTerm=&sortBy=wpa';
                const [lifecycleRaw, itemsFullRaw, itemsRaw] = await Promise.all([
                  fetchJson(lifecyclePath),
                  fetchJson('/api/info/items-full?v=08-22-2026'),
                  fetchJson('/api/info/items'),
                ]);

                const metadataRows = [...flatten(itemsFullRaw), ...flatten(itemsRaw)];
                const itemIdByName = new Map();
                for (const row of metadataRows) {
                  const name = metadataName(row);
                  const id = pickId(row);
                  if (typeof name === 'string' && id !== undefined && !itemIdByName.has(name)) {
                    itemIdByName.set(name, id);
                  }
                }

                const lifecycleRows = Array.isArray(lifecycleRaw?.items) ? lifecycleRaw.items : [];
                const matches = lifecycleRows
                  .map((row) => ({
                    item: lifecycleName(row),
                    itemId: itemIdByName.get(lifecycleName(row)),
                    heroName: row?.heroName,
                    wpaValue: row?.wpaValue,
                    sampleSize: row?.sampleSize,
                    mean_purchase_time_min: row?.mean_purchase_time_min,
                  }))
                  .filter((row) =>
                    typeof row.item === 'string' &&
                    Number.isInteger(row.itemId) &&
                    row.itemId > 0 &&
                    row.heroName === 'Billy' &&
                    typeof row.wpaValue === 'number' &&
                    typeof row.mean_purchase_time_min === 'number'
                  )
                  .slice(0, 20);

                if (matches.length < 6) {
                  throw new Error(`Expected at least 6 exact lifecycle/item metadata matches, got ${matches.length}`);
                }

                return {
                  lifecyclePath,
                  lifecycleRaw,
                  matches,
                };
              });

              process.stdout.write(JSON.stringify({
                requestedUrl,
                finalUrl: page.url(),
                ...proof,
              }, null, 2));
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Persist proof fixtures
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const probe = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/statlocker-lifecycle-probe.json', 'utf8'));
          const dir = path.join(process.cwd(), 'apps/api/test/fixtures/statlocker-item-meta-model');
          fs.mkdirSync(dir, { recursive: true });
          fs.writeFileSync(path.join(dir, 'billy.raw.json'), JSON.stringify(probe.lifecycleRaw, null, 2) + '\n');
          const expected = {
            heroId: 6,
            heroName: 'Billy',
            patchId: 'patch_676255623445218601',
            sourcePath: probe.lifecyclePath,
            items: probe.matches.slice(0, 6).map((row) => ({
              itemId: row.itemId,
              itemName: row.item,
              generalWpa: row.wpaValue,
              averagePurchaseTimeS: row.mean_purchase_time_min * 60,
              sampleSize: row.sampleSize,
            })),
          };
          fs.writeFileSync(path.join(dir, 'billy.expected.json'), JSON.stringify(expected, null, 2) + '\n');
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/test/fixtures/statlocker-item-meta-model/billy.raw.json apps/api/test/fixtures/statlocker-item-meta-model/billy.expected.json
          if git diff --cached --quiet; then
            echo "Lifecycle proof fixtures unchanged"
          else
            git commit -m "test: capture Statlocker lifecycle proof fixtures"
            git push origin HEAD:feat/statlocker-adaptive-progression-replacement
          fi

      - name: Upload lifecycle probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: statlocker-lifecycle-probe-${{ github.sha }}
          path: ${{ runner.temp }}/statlocker-lifecycle-probe.json
          if-no-files-found: error
          retention-days: 3
