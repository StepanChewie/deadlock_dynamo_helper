name: Statlocker Lifecycle Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Capture public Statlocker lifecycle source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build adaptive production image
        run: docker build -t deadlock-statlocker-probe:ci .

      - name: Capture Billy item meta source
        shell: bash
        run: |
          docker run --rm -i --entrypoint node deadlock-statlocker-probe:ci - <<'NODE' > "$RUNNER_TEMP/statlocker-lifecycle-probe.json"
          const puppeteer = require('puppeteer-core');

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROMIUM_PATH,
              headless: true,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--disable-gpu',
              ],
            });

            try {
              const page = await browser.newPage();
              const network = [];
              page.on('response', async (response) => {
                const url = response.url();
                if (!url.includes('/api/info/')) return;
                let body = '';
                try {
                  body = await response.text();
                } catch (error) {
                  body = `BODY_READ_FAILED:${String(error)}`;
                }
                network.push({ url, status: response.status(), body: body.slice(0, 500000) });
              });

              const requestedUrl = 'https://statlocker.gg/items/meta-model?hero=Billy&heroId=6&min=500&mode=items-heroes&patch=patch_676255623445218601';
              await page.goto(requestedUrl, { waitUntil: 'networkidle2', timeout: 90000 });
              await new Promise((resolve) => setTimeout(resolve, 5000));

              const direct = await page.evaluate(async () => {
                async function fetchJson(path) {
                  const response = await fetch(path, { credentials: 'same-origin' });
                  const text = await response.text();
                  let data = text;
                  try { data = JSON.parse(text); } catch {}
                  return { path, status: response.status, data };
                }
                return {
                  patches: await fetchJson('/api/info/wpa-patches'),
                  filteredItems: await fetchJson('/api/info/wpa-filtered-items?hero_id=6'),
                };
              });

              const bodyText = await page.evaluate(() => document.body.innerText);
              const html = await page.content();
              process.stdout.write(JSON.stringify({
                requestedUrl,
                finalUrl: page.url(),
                direct,
                network,
                bodyText: bodyText.slice(0, 250000),
                html: html.slice(0, 1000000),
              }, null, 2));
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload lifecycle probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: statlocker-lifecycle-probe-${{ github.sha }}
          path: ${{ runner.temp }}/statlocker-lifecycle-probe.json
          if-no-files-found: error
          retention-days: 3
