name: Runner Smoke Check

on:
  push:
    branches:
      - chore/runner-smoke-check

permissions:
  contents: read

jobs:
  smoke:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Verify runner
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          uname -a
          id
          pwd
          command -v git
          command -v docker || true
