name: Roadmap Focused Tests

on:
  push:
    branches:
      - feat/threat-weighted-wpa-build
    paths:
      - '.github/workflows/roadmap-focused-tests.yml'
      - 'packages/deadlock-build-domain/**'
      - 'packages/shared/**'
      - 'apps/api/**'
      - 'apps/overwolf-client/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout implementation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Enable Yarn 1.22.22
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          node --version
          yarn --version

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile

      - name: Build shared
        shell: bash
        run: |
          set -euo pipefail
          yarn workspace @deadlock-live-probe/shared build

      - name: Run build-domain slot capability tests
        shell: bash
        run: |
          set -euo pipefail
          yarn workspace @deadlock-live-probe/build-domain test --runTestsByPath \
            test/recommendation-category-slot-rules.spec.ts \
            test/inventory-reducer.spec.ts

      - name: Run API roadmap regression tests
        shell: bash
        run: |
          set -euo pipefail
          yarn workspace @deadlock-live-probe/api test --runTestsByPath \
            test/adaptive-config-v1.spec.ts \
            test/adaptive-economy-12-flex-slots-v1.spec.ts \
            test/adaptive-economy-v1.spec.ts \
            test/adaptive-build-planner-capacity-v1.spec.ts \
            test/adaptive-decision-state-v1.spec.ts \
            test/enemy-threat-v1.spec.ts \
            test/enemy-threat-history-v1.spec.ts \
            test/threat-weighted-matchup-v1.spec.ts \
            test/draft-matchup-evidence-v1.spec.ts \
            test/statlocker-adaptive-module-draft-matchup-v1.spec.ts \
            test/adaptive-evidence-scorer-v1.spec.ts \
            test/adaptive-recommendation-draft-matchup-v1.spec.ts \
            test/build-goal-rigidity-v1.spec.ts \
            test/build-strategy-validator-v1.spec.ts \
            test/build-slot-planner-held-count-v1.spec.ts \
            test/build-slot-planner-v1.spec.ts \
            test/transaction-plan-invariants-v1.spec.ts \
            test/statlocker-vs-hero-wpa-raw-snapshot-v1.spec.ts \
            test/statlocker-vs-hero-wpa-raw-ingest-v1.spec.ts \
            test/statlocker-vs-hero-wpa-roadmap-fixture-v1.spec.ts \
            test/statlocker-vs-hero-wpa-atomic-publish-v1.spec.ts \
            test/situational-threshold-config-v1.spec.ts \
            test/statlocker-vs-hero-wpa-row-v1.spec.ts

      - name: Build API
        shell: bash
        run: |
          set -euo pipefail
          yarn workspace @deadlock-live-probe/api build
