name: CI

on:
  # Deliberately unfiltered: every pull request gets the full suite, whatever it
  # touches, because a PR is where the review decision is actually made.
  pull_request:
  push:
    branches:
      - main
    # Matches the Deploy API filter. A docs-only commit cannot change the build
    # or the tests, and running four jobs for a README tweak is pure cost.
    # Note this only applies to `push`; PRs are unaffected.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-project:
    name: Build project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build shared package
        run: yarn workspace @dynamo-lab/shared build

      - name: Build all workspaces
        env:
          OVERWOLF_PUBLIC_TARGET: ${{ runner.temp }}/overwolf-client/public
        run: yarn build

  build-overwolf:
    name: Build Overwolf client
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build shared package
        run: yarn workspace @dynamo-lab/shared build

      - name: Build Overwolf client
        shell: bash
        env:
          OVERWOLF_PUBLIC_TARGET: ${{ runner.temp }}/overwolf-client/public
        run: |
          set +e
          yarn workspace @dynamo-lab/overwolf-client build > "$RUNNER_TEMP/overwolf-build.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 200 "$RUNNER_TEMP/overwolf-build.log"
            exit "$status"
          fi
          tail -n 20 "$RUNNER_TEMP/overwolf-build.log"

      - name: Upload failed Overwolf build log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: overwolf-build-log-${{ github.sha }}
          path: ${{ runner.temp }}/overwolf-build.log
          if-no-files-found: error
          retention-days: 3

      - name: Upload Overwolf build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: overwolf-client-${{ github.sha }}
          path: ${{ runner.temp }}/overwolf-client/public
          if-no-files-found: error
          retention-days: 7

  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Test shared package
        run: yarn workspace @dynamo-lab/shared test


      - name: Test domain package
        run: yarn workspace @dynamo-lab/build-domain test

      - name: Test API
        shell: bash
        run: |
          set +e
          yarn workspace @dynamo-lab/api test > "$RUNNER_TEMP/api-tests.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 200 "$RUNNER_TEMP/api-tests.log"
            exit "$status"
          fi
          tail -n 20 "$RUNNER_TEMP/api-tests.log"

      - name: Run frozen Billy family-first review gate
        run: yarn workspace @dynamo-lab/api test --runTestsByPath test/statlocker-build-v2-real-data.e2e.spec.ts


      - name: Upload failed API test log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-test-log-${{ github.sha }}
          path: ${{ runner.temp }}/api-tests.log
          if-no-files-found: error
          retention-days: 3

      - name: Test Overwolf client
        shell: bash
        run: |
          set +e
          yarn workspace @dynamo-lab/overwolf-client test > "$RUNNER_TEMP/overwolf-tests.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 200 "$RUNNER_TEMP/overwolf-tests.log"
            exit "$status"
          fi
          tail -n 20 "$RUNNER_TEMP/overwolf-tests.log"

      - name: Upload failed Overwolf test log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: overwolf-test-log-${{ github.sha }}
          path: ${{ runner.temp }}/overwolf-tests.log
          if-no-files-found: error
          retention-days: 3

  production-validation:
    name: Validate production runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deadlock_builds
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build shared package
        run: yarn workspace @dynamo-lab/shared build

      - name: Test production database migration
        env:
          DB_MIGRATION_INTEGRATION: 'true'
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: deadlock_builds
        run: yarn workspace @dynamo-lab/api test production-database-migration.integration.spec.ts

      - name: Test real VS_HERO_WPA PostgreSQL serving path
        env:
          WPA_REPOSITORY_INTEGRATION: 'true'
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: deadlock_builds
        run: yarn workspace @dynamo-lab/api test statlocker-vs-hero-wpa-v2.integration.spec.ts

      - name: Validate adaptive Compose config
        env:
          DB_PASSWORD: ci-placeholder
          DEADLOCK_API_KEY: ci-placeholder
          DEADLOCK_API_IMAGE: deadlock-adaptive-production:ci
        run: docker compose -p deadlock-ci config >/dev/null

      - name: Build adaptive production image
        run: docker build -t deadlock-adaptive-production:ci .

      - name: Verify adaptive runtime dependencies
        run: |
          docker run --rm --entrypoint sh deadlock-adaptive-production:ci -c \
            'test -x "$CHROMIUM_PATH" && node -e "require(\"puppeteer-core\"); require(\"@dynamo-lab/build-domain\")"'
