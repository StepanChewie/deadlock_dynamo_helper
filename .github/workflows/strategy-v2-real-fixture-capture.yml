name: Strategy V2 Real Billy Fixture Capture

on:
  push:
    branches:
      - feat/statlocker-build-strategy-v2
    paths:
      - '.github/workflows/strategy-v2-real-fixture-capture.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: [self-hosted, Linux, Arm64]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build fixture capture image
        shell: bash
        run: |
          set -euo pipefail
          image="deadlock-strategy-v2-fixture:${GITHUB_SHA}"
          sudo docker build -t "$image" .
          echo "CAPTURE_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Resolve Billy match from raw Overwolf live state and capture fixture
        shell: bash
        run: |
          set -euo pipefail
          prod_dir=/home/ubuntu/apps/deadlock_dynamo_helper
          api_container="$(cd "$prod_dir" && sudo docker compose ps -q api)"
          test -n "$api_container"

          network="$(sudo docker inspect "$api_container" --format='{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' | head -n1)"
          test -n "$network"

          match_id="$(cd "$prod_dir" && sudo docker compose exec -T api node <<'NODE'
          const { Client } = require('pg');
          const { readdir, readFile, stat } = require('node:fs/promises');
          const { basename, join } = require('node:path');

          function positiveHeroIds(values) {
            return Array.isArray(values)
              ? [...new Set(values.filter((value) => Number.isSafeInteger(value) && value > 0))]
              : [];
          }

          function eventContainsBilly(event) {
            if (!event || typeof event !== 'object') return false;
            if (typeof event.key === 'string' && event.key.startsWith('roster')) {
              const payload = event.payload;
              if (payload && typeof payload === 'object' && Number(payload.hero_id ?? payload.heroId) === 72) return true;
            }
            return false;
          }

          async function liveStateCandidates() {
            try {
              const response = await fetch('http://127.0.0.1:3000/deadlock/live/states');
              if (!response.ok) return [];
              const states = await response.json();
              if (!Array.isArray(states)) return [];
              return states
                .filter((state) => {
                  const players = state?.playersBySteamId && typeof state.playersBySteamId === 'object'
                    ? Object.values(state.playersBySteamId)
                    : [];
                  return players.some((player) => Number(player?.heroId) === 72);
                })
                .map((state) => String(state.matchId ?? ''))
                .filter((matchId) => /^\d+$/.test(matchId));
            } catch {
              return [];
            }
          }

          async function rawLogCandidates() {
            const dir = process.env.DEADLOCK_LIVE_RAW_LOG_DIR?.trim()
              || join(process.cwd(), 'storage', 'deadlock-live');
            let names;
            try {
              names = (await readdir(dir)).filter((name) => name.endsWith('.ndjson'));
            } catch (error) {
              process.stderr.write(`Raw live log directory unavailable: ${dir}: ${error?.message || error}\n`);
              return [];
            }

            const files = await Promise.all(names.map(async (name) => ({
              name,
              mtimeMs: (await stat(join(dir, name))).mtimeMs,
            })));
            files.sort((a, b) => b.mtimeMs - a.mtimeMs || a.name.localeCompare(b.name));

            const candidates = [];
            for (const file of files) {
              const filePath = join(dir, file.name);
              let text;
              try {
                text = await readFile(filePath, 'utf8');
              } catch {
                continue;
              }
              let containsBilly = false;
              let explicitMatchId;
              for (const line of text.split('\n')) {
                if (!line.trim()) continue;
                try {
                  const event = JSON.parse(line);
                  if (eventContainsBilly(event)) containsBilly = true;
                  if (!explicitMatchId && typeof event.matchId === 'string' && /^\d+$/.test(event.matchId)) {
                    explicitMatchId = event.matchId;
                  }
                } catch {
                  continue;
                }
              }
              if (!containsBilly) continue;
              const filenameMatchId = basename(file.name, '.ndjson');
              const matchId = explicitMatchId ?? filenameMatchId;
              if (/^\d+$/.test(matchId)) candidates.push(matchId);
            }
            process.stderr.write(`Raw live logs inspected: files=${files.length} BillyCandidates=${candidates.length}\n`);
            return candidates;
          }

          async function main() {
            const client = new Client({
              host: process.env.DB_HOST,
              port: Number(process.env.DB_PORT || 5432),
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME,
              connectionTimeoutMillis: 10000,
            });
            await client.connect();
            try {
              await client.query('BEGIN TRANSACTION READ ONLY');
              await client.query("SET LOCAL statement_timeout = '10s'");

              const candidates = [...new Set([
                ...(await liveStateCandidates()),
                ...(await rawLogCandidates()),
              ])];
              if (candidates.length === 0) {
                throw new Error('No Billy match IDs found in current in-memory or retained raw Overwolf live state');
              }

              for (const matchId of candidates) {
                const replay = await client.query(`
                  SELECT "decisionId", "replayInput", "decidedAt"
                  FROM adaptive_recommendation_decisions_v1
                  WHERE "matchId" = $1
                  ORDER BY "decidedAt" DESC, "decisionId" DESC
                  LIMIT 100
                `, [matchId]);

                for (const row of replay.rows) {
                  const decision = row?.replayInput?.decision;
                  if (decision?.state?.heroId !== 72) continue;
                  if (String(decision?.state?.matchId) !== matchId) continue;
                  if (positiveHeroIds(decision?.enemyHeroIds).length !== 6) continue;
                  process.stderr.write(`Resolved Billy replay from Overwolf live state: match=${matchId} decision=${row.decisionId}\n`);
                  process.stdout.write(matchId);
                  await client.query('ROLLBACK');
                  return;
                }
              }

              throw new Error(`Found ${candidates.length} Billy Overwolf match IDs, but none has a complete saved adaptive replay`);
            } finally {
              await client.end();
            }
          }

          main().catch((error) => {
            console.error(error?.stack || error);
            process.exit(1);
          });
          NODE
          )"
          test -n "$match_id"
          echo "Resolved Billy matchId=$match_id"

          env_file="$RUNNER_TEMP/strategy-v2-production-api.env"
          cleanup() {
            rm -f "$env_file"
            sudo docker image rm -f "$CAPTURE_IMAGE" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          sudo docker inspect "$api_container" --format='{{range .Config.Env}}{{println .}}{{end}}' > "$env_file"
          chmod 600 "$env_file"
          mkdir -p "$RUNNER_TEMP/strategy-v2-fixture"

          sudo docker run --rm \
            --network "$network" \
            --env-file "$env_file" \
            -e PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=10000' \
            -v "$RUNNER_TEMP/strategy-v2-fixture:/capture" \
            --entrypoint node \
            "$CAPTURE_IMAGE" \
            dist/src/scripts/capture-statlocker-build-v2-fixture.js \
            --heroId 72 \
            --matchId "$match_id" \
            --out /capture/billy-real.fixture.json

          sudo docker run --rm \
            -v "$RUNNER_TEMP/strategy-v2-fixture:/capture:ro" \
            --entrypoint node \
            "$CAPTURE_IMAGE" \
            -e '
              const fixture = require("/capture/billy-real.fixture.json");
              if (fixture?.metadata?.contract !== "STATLOCKER_BUILD_V2_REAL_FIXTURE_1") throw new Error("fixture contract mismatch");
              if (fixture?.metadata?.source !== "EXISTING_DATABASE") throw new Error("fixture source mismatch");
              if (fixture?.metadata?.heroId !== 72) throw new Error("fixture hero mismatch");
              if (!/^\d+$/.test(String(fixture?.metadata?.matchId ?? ""))) throw new Error("fixture match mismatch");
              if (!Array.isArray(fixture?.proBuildAnalyses) || fixture.proBuildAnalyses.length !== 10) throw new Error("fixture top-10 provenance mismatch");
              if (!Array.isArray(fixture?.liveState?.enemyHeroIds) || new Set(fixture.liveState.enemyHeroIds).size !== 6) throw new Error("fixture enemy roster mismatch");
              if (!Array.isArray(fixture?.catalog?.items) || fixture.catalog.items.length === 0) throw new Error("fixture catalog is empty");
              if (!Array.isArray(fixture?.metadata?.snapshotProvenance) || fixture.metadata.snapshotProvenance.length < 13) throw new Error("fixture snapshot provenance incomplete");
              process.stdout.write(`Validated Billy real fixture: match=${fixture.metadata.matchId} profiles=${fixture.proBuildAnalyses.length} enemies=${fixture.liveState.enemyHeroIds.length} catalogItems=${fixture.catalog.items.length}\n`);
            '

      - name: Upload real Billy fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: statlocker-build-v2-billy-real-${{ github.sha }}
          path: ${{ runner.temp }}/strategy-v2-fixture/billy-real.fixture.json
          if-no-files-found: error
          retention-days: 3
